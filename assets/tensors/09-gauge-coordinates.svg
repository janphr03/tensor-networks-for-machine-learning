<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" aria-labelledby="title description"><title id="title">Gauge freedom as a coordinate translation</title><desc id="description">The same vector two comma one is described in an ordinary basis and a basis rotated ninety degrees. Its coordinates become one comma minus two. A tensor-bond transformation inserts G and its inverse without changing the full contraction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="960" height="495" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="35" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">A new coordinate language; the same vector</text><text x="235" y="83" font-size="23" fill="#173552" text-anchor="middle" font-weight="bold">original basis</text><line x1="120" y1="260" x2="355" y2="260" stroke="#E8EEF4" stroke-width="1"/><line x1="185" y1="320" x2="185" y2="110" stroke="#E8EEF4" stroke-width="1"/><line x1="185" y1="260" x2="345" y2="260" stroke="#2166AC" stroke-width="3" marker-end="url(#arrow)"/><line x1="185" y1="260" x2="185" y2="125" stroke="#008C82" stroke-width="3" marker-end="url(#arrow)"/><text x="358" y="267" font-size="20" fill="#2166AC" text-anchor="start" font-weight="normal">e₁</text><text x="193" y="120" font-size="20" fill="#008C82" text-anchor="start" font-weight="normal">e₂</text><line x1="305" y1="260" x2="305" y2="200" stroke="#617185" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="185" y1="200" x2="305" y2="200" stroke="#617185" stroke-width="1.5" stroke-dasharray="6 5"/><text x="305" y="290" font-size="20" fill="#2166AC" text-anchor="middle" font-weight="normal">2</text><text x="170" y="205" font-size="20" fill="#008C82" text-anchor="end" font-weight="normal">1</text><line x1="185" y1="260" x2="305" y2="200" stroke="#D46B32" stroke-width="5" marker-end="url(#arrow)"/><circle cx="305" cy="200" r="6" fill="#D46B32" stroke="#FFFFFF" stroke-width="2"/><text x="317" y="188" font-size="20" fill="#D46B32" text-anchor="start" font-weight="normal">same v</text><text x="235" y="345" font-size="22" fill="#173552" text-anchor="middle" font-weight="normal">v = 2e₁ + e₂</text><text x="705" y="83" font-size="23" fill="#173552" text-anchor="middle" font-weight="bold">rotated basis</text><line x1="590" y1="260" x2="825" y2="260" stroke="#E8EEF4" stroke-width="1"/><line x1="655" y1="320" x2="655" y2="110" stroke="#E8EEF4" stroke-width="1"/><line x1="655" y1="260" x2="655" y2="125" stroke="#2166AC" stroke-width="3" marker-end="url(#arrow)"/><line x1="655" y1="260" x2="515" y2="260" stroke="#008C82" stroke-width="3" marker-end="url(#arrow)"/><text x="665" y="120" font-size="20" fill="#2166AC" text-anchor="start" font-weight="normal">e₁′</text><text x="507" y="250" font-size="20" fill="#008C82" text-anchor="end" font-weight="normal">e₂′</text><line x1="775" y1="260" x2="775" y2="200" stroke="#617185" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="655" y1="200" x2="775" y2="200" stroke="#617185" stroke-width="1.5" stroke-dasharray="6 5"/><text x="775" y="290" font-size="19" fill="#008C82" text-anchor="middle" font-weight="normal">−2 along e₂′</text><text x="640" y="205" font-size="20" fill="#2166AC" text-anchor="end" font-weight="normal">1</text><line x1="655" y1="260" x2="775" y2="200" stroke="#D46B32" stroke-width="5" marker-end="url(#arrow)"/><circle cx="775" cy="200" r="6" fill="#D46B32" stroke="#FFFFFF" stroke-width="2"/><text x="787" y="188" font-size="20" fill="#D46B32" text-anchor="start" font-weight="normal">same v</text><text x="705" y="345" font-size="22" fill="#173552" text-anchor="middle" font-weight="normal">v = e₁′ − 2e₂′</text><text x="480" y="410" font-size="20" fill="#617185" text-anchor="middle" font-weight="normal">A tensor bond can also change basis without changing the represented object.</text><text x="480" y="460" font-size="25" fill="#173552" text-anchor="middle" font-weight="normal">AB = (AG)(G⁻¹B)     ·     G must be invertible</text></g></svg>