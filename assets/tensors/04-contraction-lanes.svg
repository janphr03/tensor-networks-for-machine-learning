<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description"><title id="title">Contraction as matching lanes</title><desc id="description">Three lanes show products four, minus two, and six. They merge to the scalar eight. The orange lane is a negative algebraic contribution, not a negative amount of physical material.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="960" height="410" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="35" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">Match each lane, then add its signed contribution</text><text x="170" y="83" font-size="22" fill="#2166AC" text-anchor="middle" font-weight="normal">aₖ</text><text x="320" y="83" font-size="22" fill="#008C82" text-anchor="middle" font-weight="normal">bₖ</text><text x="35" y="137" font-size="19" fill="#617185" text-anchor="start" font-weight="normal">k = 1</text><circle cx="170" cy="130" r="27" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="138" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">1</text><text x="244" y="137" font-size="30" fill="#617185" text-anchor="middle" font-weight="normal">×</text><circle cx="320" cy="130" r="27" fill="#008C82" stroke="#FFFFFF" stroke-width="2"/><text x="320" y="138" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">4</text><line x1="360" y1="130" x2="450" y2="130" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><circle cx="500" cy="130" r="31" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="500" y="138" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">+4</text><path d="M535,130 C610,130 645,215 685,215" stroke="#2166AC" stroke-width="3" fill="none"/><text x="35" y="222" font-size="19" fill="#617185" text-anchor="start" font-weight="normal">k = 2</text><circle cx="170" cy="215" r="27" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="223" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">2</text><text x="244" y="222" font-size="30" fill="#617185" text-anchor="middle" font-weight="normal">×</text><circle cx="320" cy="215" r="27" fill="#008C82" stroke="#FFFFFF" stroke-width="2"/><text x="320" y="223" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">-1</text><line x1="360" y1="215" x2="450" y2="215" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><circle cx="500" cy="215" r="31" fill="#D46B32" stroke="#FFFFFF" stroke-width="2"/><text x="500" y="223" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">-2</text><path d="M535,215 C610,215 645,215 685,215" stroke="#D46B32" stroke-width="3" fill="none"/><text x="35" y="307" font-size="19" fill="#617185" text-anchor="start" font-weight="normal">k = 3</text><circle cx="170" cy="300" r="27" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="308" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">3</text><text x="244" y="307" font-size="30" fill="#617185" text-anchor="middle" font-weight="normal">×</text><circle cx="320" cy="300" r="27" fill="#008C82" stroke="#FFFFFF" stroke-width="2"/><text x="320" y="308" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">2</text><line x1="360" y1="300" x2="450" y2="300" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><circle cx="500" cy="300" r="31" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="500" y="308" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="normal">+6</text><path d="M535,300 C610,300 645,215 685,215" stroke="#2166AC" stroke-width="3" fill="none"/><path d="M681,187 Q704,180 725,187 L731,270 Q704,295 675,270 Z" stroke="#173552" stroke-width="3" fill="#F5F8FB"/><text x="704" y="233" font-size="32" fill="#173552" text-anchor="middle" font-weight="bold">8</text><text x="790" y="213" font-size="21" fill="#173552" text-anchor="start" font-weight="normal">4 − 2 + 6</text><text x="790" y="245" font-size="25" fill="#173552" text-anchor="start" font-weight="normal">= 8</text><text x="460" y="370" font-size="21" fill="#173552" text-anchor="middle" font-weight="normal">The index k is used internally; the result has no k-axis.</text></g></svg>