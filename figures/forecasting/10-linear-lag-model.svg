<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title description"><title id="title">Linear lag regression as a weighted sum</title><desc id="description">Four recent values are multiplied by learned weights, summed, and shifted by a bias. The most recent value has the largest weight. The result is the forecast for the next step.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="480" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="38" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">A linear model weights recent values and adds them up</text><text x="40" y="131" font-size="17" fill="#173552" text-anchor="start" font-weight="bold">values</text><text x="40" y="236" font-size="17" fill="#173552" text-anchor="start" font-weight="bold">weights</text><text x="180" y="86" font-size="19" fill="#617185" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">t−3</tspan></text><rect x="130" y="100" width="100" height="50" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="180" y="132.35" font-size="21" fill="#173552" text-anchor="middle" font-weight="normal">8.0</text><line x1="180" y1="150" x2="180" y2="276" stroke="#E8EEF4" stroke-width="2"/><rect x="160" y="280" width="40" height="10" rx="3" fill="#173552" stroke="none" stroke-width="0"/><text x="180" y="312" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">w = 0.05</text><line x1="180" y1="322" x2="180" y2="346" stroke="#617185" stroke-width="2"/><text x="320" y="86" font-size="19" fill="#617185" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">t−2</tspan></text><rect x="270" y="100" width="100" height="50" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="320" y="132.35" font-size="21" fill="#173552" text-anchor="middle" font-weight="normal">8.4</text><line x1="320" y1="150" x2="320" y2="266" stroke="#E8EEF4" stroke-width="2"/><rect x="300" y="270" width="40" height="20" rx="3" fill="#173552" stroke="none" stroke-width="0"/><text x="320" y="312" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">w = 0.10</text><line x1="320" y1="322" x2="320" y2="346" stroke="#617185" stroke-width="2"/><text x="460" y="86" font-size="19" fill="#617185" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">t−1</tspan></text><rect x="410" y="100" width="100" height="50" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="460" y="132.35" font-size="21" fill="#173552" text-anchor="middle" font-weight="normal">9.0</text><line x1="460" y1="150" x2="460" y2="236" stroke="#E8EEF4" stroke-width="2"/><rect x="440" y="240" width="40" height="50" rx="3" fill="#173552" stroke="none" stroke-width="0"/><text x="460" y="312" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">w = 0.25</text><line x1="460" y1="322" x2="460" y2="346" stroke="#617185" stroke-width="2"/><text x="600" y="86" font-size="19" fill="#617185" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">t</tspan></text><rect x="550" y="100" width="100" height="50" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="600" y="132.35" font-size="21" fill="#173552" text-anchor="middle" font-weight="normal">9.6</text><line x1="600" y1="150" x2="600" y2="166" stroke="#E8EEF4" stroke-width="2"/><rect x="580" y="170" width="40" height="120" rx="3" fill="#173552" stroke="none" stroke-width="0"/><text x="600" y="312" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">w = 0.60</text><line x1="600" y1="322" x2="600" y2="346" stroke="#617185" stroke-width="2"/><line x1="180" y1="346" x2="690" y2="346" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><circle cx="735" cy="346" r="38" fill="#FFFFFF" stroke="#173552" stroke-width="2.5"/><text x="735" y="358" font-size="32" fill="#173552" text-anchor="middle" font-weight="bold">Σ</text><text x="735" y="408" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">+ bias b = 0.2</text><line x1="773" y1="346" x2="803" y2="346" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="322" width="120" height="48" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="870" y="353.35" font-size="21" fill="#D46B32" text-anchor="middle" font-weight="normal">9.45</text><text x="870" y="306" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">t+1</tspan></text><text x="480" y="456" font-size="18" fill="#173552" text-anchor="middle" font-weight="normal">ŷ = 0.2 + 0.05 · 8.0 + 0.10 · 8.4 + 0.25 · 9.0 + 0.60 · 9.6 = 9.45</text></g></svg>