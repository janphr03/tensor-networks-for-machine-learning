<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title description"><title id="title">Recursive and direct multi-step forecasts</title><desc id="description">Recursive: a one-step model is applied three times and its own forecasts move into the input window. Direct: one model returns all three future values at once.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="430" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="38" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">Two ways to forecast several steps</text><text x="40" y="84" font-size="20" fill="#173552" text-anchor="start" font-weight="bold">recursive</text><text x="40" y="127" font-size="17" fill="#617185" text-anchor="start" font-weight="normal">step 1</text><rect x="150" y="100" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="176" y="126" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">1</tspan></text><rect x="210" y="100" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="236" y="126" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">2</tspan></text><rect x="270" y="100" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="296" y="126" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">3</tspan></text><rect x="330" y="100" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="356" y="126" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">4</tspan></text><line x1="398" y1="120" x2="438" y2="120" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="444" y="100" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#173552" stroke-width="2"/><text x="539" y="126" font-size="18" fill="#173552" text-anchor="middle" font-weight="normal">one-step model</text><line x1="634" y1="120" x2="674" y2="120" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="100" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="706" y="126" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">1</tspan></text><path d="M706,141 C706,156 356,146 356,157" stroke="#D46B32" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/><text x="40" y="189" font-size="17" fill="#617185" text-anchor="start" font-weight="normal">step 2</text><rect x="150" y="162" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="176" y="188" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">2</tspan></text><rect x="210" y="162" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="236" y="188" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">3</tspan></text><rect x="270" y="162" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="296" y="188" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">4</tspan></text><rect x="330" y="162" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="356" y="188" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">1</tspan></text><line x1="398" y1="182" x2="438" y2="182" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="444" y="162" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#173552" stroke-width="2"/><text x="539" y="188" font-size="18" fill="#173552" text-anchor="middle" font-weight="normal">one-step model</text><line x1="634" y1="182" x2="674" y2="182" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="162" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="706" y="188" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">2</tspan></text><path d="M706,203 C706,218 356,208 356,219" stroke="#D46B32" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/><text x="40" y="251" font-size="17" fill="#617185" text-anchor="start" font-weight="normal">step 3</text><rect x="150" y="224" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="176" y="250" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">3</tspan></text><rect x="210" y="224" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="236" y="250" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">4</tspan></text><rect x="270" y="224" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="296" y="250" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">1</tspan></text><rect x="330" y="224" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="356" y="250" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">2</tspan></text><line x1="398" y1="244" x2="438" y2="244" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="444" y="224" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#173552" stroke-width="2"/><text x="539" y="250" font-size="18" fill="#173552" text-anchor="middle" font-weight="normal">one-step model</text><line x1="634" y1="244" x2="674" y2="244" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="224" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="706" y="250" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">3</tspan></text><text x="780" y="132" font-size="17" fill="#D46B32" text-anchor="start" font-weight="normal">own forecasts</text><text x="780" y="154" font-size="17" fill="#D46B32" text-anchor="start" font-weight="normal">are fed back:</text><text x="780" y="176" font-size="17" fill="#D46B32" text-anchor="start" font-weight="normal">errors can add up</text><line x1="40" y1="302" x2="920" y2="302" stroke="#E8EEF4" stroke-width="2"/><text x="40" y="340" font-size="20" fill="#173552" text-anchor="start" font-weight="bold">direct</text><rect x="150" y="360" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="176" y="386" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">1</tspan></text><rect x="210" y="360" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="236" y="386" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">2</tspan></text><rect x="270" y="360" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="296" y="386" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">3</tspan></text><rect x="330" y="360" width="52" height="40" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="356" y="386" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="13">4</tspan></text><line x1="398" y1="380" x2="438" y2="380" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="444" y="360" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#173552" stroke-width="2"/><text x="539" y="386" font-size="18" fill="#173552" text-anchor="middle" font-weight="normal">multi-output model</text><line x1="634" y1="380" x2="674" y2="380" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="360" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="706" y="386" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">1</tspan></text><rect x="740" y="360" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="766" y="386" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">2</tspan></text><rect x="800" y="360" width="52" height="40" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="826" y="386" font-size="19" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="13">3</tspan></text><text x="866" y="386" font-size="16" fill="#D46B32" text-anchor="start" font-weight="normal">all at once</text></g></svg>