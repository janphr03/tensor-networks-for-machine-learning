<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img"><title>Self-attention: a query and keys from one input window determine weights that combine its value vectors</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#617185"/></marker></defs><rect width="960" height="780" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="28" font-size="24" text-anchor="middle" fill="#173552">1  Start with representations from the same input window</text><rect x="25" y="46" width="910" height="132" rx="10" fill="none" stroke="#AAB8C5" stroke-width="2" stroke-dasharray="7 5"/><rect x="60" y="65" width="220" height="70" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="170" y="108" font-size="24" text-anchor="middle" fill="#2166AC"></text><text x="170" y="91" font-size="18" text-anchor="middle" fill="#2166AC">Position 1</text><text x="170" y="122" font-size="25" text-anchor="middle" fill="#2166AC">h₁</text><text x="170" y="158" font-size="19" text-anchor="middle" fill="#2166AC">From 12 °C</text><rect x="370" y="65" width="220" height="70" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="480" y="108" font-size="24" text-anchor="middle" fill="#2166AC"></text><text x="480" y="91" font-size="18" text-anchor="middle" fill="#2166AC">Position 2</text><text x="480" y="122" font-size="25" text-anchor="middle" fill="#2166AC">h₂</text><text x="480" y="158" font-size="19" text-anchor="middle" fill="#2166AC">From 13 °C</text><rect x="680" y="65" width="220" height="70" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="790" y="108" font-size="24" text-anchor="middle" fill="#008C82"></text><text x="790" y="91" font-size="18" text-anchor="middle" fill="#008C82">Position 3 (selected)</text><text x="790" y="122" font-size="25" text-anchor="middle" fill="#008C82">h₃</text><text x="790" y="158" font-size="19" text-anchor="middle" fill="#008C82">From 15 °C</text><text x="480" y="218" font-size="24" text-anchor="middle" fill="#173552">2  Compare the selected query with the keys; compute weights</text><text x="150" y="258" font-size="20" text-anchor="middle" fill="#008C82">Query from h₃</text><rect x="45" y="315" width="210" height="60" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="150" y="353" font-size="24" text-anchor="middle" fill="#008C82">q₃</text><text x="440" y="252" font-size="20" text-anchor="middle" fill="#173552">Key comparisons</text><text x="865" y="252" font-size="20" text-anchor="middle" fill="#173552">Weights</text><path d="M260,345 L335,292" fill="none" stroke="#008C82" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="271" width="190" height="42" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="440" y="300" font-size="24" text-anchor="middle" fill="#173552">q₃ with k₁</text><path d="M540,292 L595,345" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,345 L805,292" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="271" width="105" height="42" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="867.5" y="300" font-size="24" text-anchor="middle" fill="#008C82">0.6</text><path d="M260,345 L335,345" fill="none" stroke="#008C82" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="324" width="190" height="42" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="440" y="353" font-size="24" text-anchor="middle" fill="#173552">q₃ with k₂</text><path d="M540,345 L595,345" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,345 L805,345" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="324" width="105" height="42" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="867.5" y="353" font-size="24" text-anchor="middle" fill="#008C82">0.1</text><path d="M260,345 L335,398" fill="none" stroke="#008C82" stroke-width="2" marker-end="url(#arrow)"/><rect x="345" y="377" width="190" height="42" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="440" y="406" font-size="24" text-anchor="middle" fill="#173552">q₃ with k₃</text><path d="M540,398 L595,345" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,345 L805,398" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="815" y="377" width="105" height="42" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="867.5" y="406" font-size="24" text-anchor="middle" fill="#008C82">0.3</text><rect x="605" y="302" width="150" height="86" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="680" y="328" font-size="21" text-anchor="middle" fill="#173552">Normalize</text><text x="680" y="352" font-size="21" text-anchor="middle" fill="#173552">all scores</text><text x="680" y="376" font-size="19" text-anchor="middle" fill="#617185">(softmax)</text><text x="480" y="448" font-size="20" text-anchor="middle" fill="#617185">q₃, k₁–k₃ and v₁–v₃ are learned projections of h₁–h₃.</text><text x="480" y="493" font-size="24" text-anchor="middle" fill="#173552">3  Weight and combine the values from the same window</text><rect x="60" y="518" width="220" height="55" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="170" y="553.5" font-size="24" text-anchor="middle" fill="#2166AC">0.6 × v₁</text><path d="M170,580 L453,624" fill="none" stroke="#2166AC" stroke-width="3.4" marker-end="url(#arrow)"/><rect x="370" y="518" width="220" height="55" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="480" y="553.5" font-size="24" text-anchor="middle" fill="#2166AC">0.1 × v₂</text><path d="M480,580 L480,600" fill="none" stroke="#2166AC" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="680" y="518" width="220" height="55" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="790" y="553.5" font-size="24" text-anchor="middle" fill="#2166AC">0.3 × v₃</text><path d="M790,580 L507,624" fill="none" stroke="#2166AC" stroke-width="2.2" marker-end="url(#arrow)"/><circle cx="480" cy="628" r="22" fill="white" stroke="#173552" stroke-width="2"/><text x="480" y="636" font-size="28" text-anchor="middle" fill="#173552">+</text><path d="M480,655 L480,671" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="680" width="410" height="52" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="480" y="714" font-size="24" text-anchor="middle" fill="#008C82">z₃: combined information</text><text x="480" y="760" font-size="20" text-anchor="middle" fill="#617185">Attention output for position 3; weights are illustrative.</text></g></svg>