<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img"><title>Attention can select different past information for different input windows</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#617185"/></marker></defs><rect width="960" height="610" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="225" y="25" font-size="22" text-anchor="middle" fill="#173552">Window A</text><path d="M830,120 C830,30 125,30 125,120" fill="none" stroke="#008C82" stroke-width="5.8999999999999995" marker-end="url(#arrow)"/><path d="M830,120 C830,55 350,55 350,120" fill="none" stroke="#AAB8C5" stroke-width="2.4000000000000004" marker-end="url(#arrow)"/><path d="M830,120 C830,78 575,78 575,120" fill="none" stroke="#AAB8C5" stroke-width="1.7000000000000002" marker-end="url(#arrow)"/><rect x="40" y="120" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="125" y="146" font-size="19" text-anchor="middle" fill="#008C82">Earlier interval 1</text><polyline points="62,196.5 93,191.25 124,184.25 155,175.5 186,168.5" fill="none" stroke="#008C82" stroke-width="3"/><text x="125" y="245" font-size="19" text-anchor="middle" fill="#008C82">Weight: 0.7</text><rect x="265" y="120" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="350" y="146" font-size="19" text-anchor="middle" fill="#2166AC">Earlier interval 2</text><polyline points="287,168.5 318,175.5 349,182.5 380,189.5 411,196.5" fill="none" stroke="#2166AC" stroke-width="3"/><text x="350" y="245" font-size="19" text-anchor="middle" fill="#2166AC">Weight: 0.2</text><rect x="490" y="120" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="575" y="146" font-size="19" text-anchor="middle" fill="#2166AC">Earlier interval 3</text><polyline points="512,182.5 543,182.5 574,182.5 605,182.5 636,182.5" fill="none" stroke="#2166AC" stroke-width="3"/><text x="575" y="245" font-size="19" text-anchor="middle" fill="#2166AC">Weight: 0.1</text><rect x="745" y="120" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="830" y="146" font-size="19" text-anchor="middle" fill="#008C82">Current pattern</text><polyline points="767,196.5 798,191.25 829,184.25 860,175.5 891,168.5" fill="none" stroke="#008C82" stroke-width="3"/><text x="830" y="245" font-size="19" text-anchor="middle" fill="#008C82">Position being updated</text><text x="225" y="290" font-size="22" text-anchor="middle" fill="#173552">Window B: different current input</text><path d="M830,385 C830,295 125,295 125,385" fill="none" stroke="#AAB8C5" stroke-width="1.7000000000000002" marker-end="url(#arrow)"/><path d="M830,385 C830,320 350,320 350,385" fill="none" stroke="#AAB8C5" stroke-width="2.4000000000000004" marker-end="url(#arrow)"/><path d="M830,385 C830,343 575,343 575,385" fill="none" stroke="#008C82" stroke-width="5.8999999999999995" marker-end="url(#arrow)"/><rect x="40" y="385" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="125" y="411" font-size="19" text-anchor="middle" fill="#2166AC">Earlier interval 1</text><polyline points="62,461.5 93,456.25 124,449.25 155,440.5 186,433.5" fill="none" stroke="#2166AC" stroke-width="3"/><text x="125" y="510" font-size="19" text-anchor="middle" fill="#2166AC">Weight: 0.1</text><rect x="265" y="385" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="350" y="411" font-size="19" text-anchor="middle" fill="#2166AC">Earlier interval 2</text><polyline points="287,433.5 318,440.5 349,447.5 380,454.5 411,461.5" fill="none" stroke="#2166AC" stroke-width="3"/><text x="350" y="510" font-size="19" text-anchor="middle" fill="#2166AC">Weight: 0.2</text><rect x="490" y="385" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="575" y="411" font-size="19" text-anchor="middle" fill="#008C82">Earlier interval 3</text><polyline points="512,447.5 543,447.5 574,447.5 605,447.5 636,447.5" fill="none" stroke="#008C82" stroke-width="3"/><text x="575" y="510" font-size="19" text-anchor="middle" fill="#008C82">Weight: 0.7</text><rect x="745" y="385" width="170" height="95" rx="6" fill="#F5F8FB" stroke="#008C82" stroke-width="2"/><text x="830" y="411" font-size="19" text-anchor="middle" fill="#008C82">Current pattern</text><polyline points="767,447.5 798,447.5 829,447.5 860,447.5 891,447.5" fill="none" stroke="#008C82" stroke-width="3"/><text x="830" y="510" font-size="19" text-anchor="middle" fill="#008C82">Position being updated</text><text x="480" y="555" font-size="23" text-anchor="middle" fill="#173552">Different current input → different influence of earlier intervals</text><text x="480" y="586" font-size="21" text-anchor="middle" fill="#617185">Thicker link = greater attention weight (illustrative)</text></g></svg>