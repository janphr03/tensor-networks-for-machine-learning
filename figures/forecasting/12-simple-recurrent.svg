<svg xmlns="http://www.w3.org/2000/svg" width="960" height="255" viewBox="0 0 960 255" role="img"><title>The same recurrent unit updates a state across three readings</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#617185"/></marker></defs><rect width="960" height="255" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><rect x="45" y="25" width="150" height="44" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="120" y="55" font-size="24" text-anchor="middle" fill="#2166AC">12 °C</text><path d="M120,75 L120,115" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="125" width="150" height="54" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="120" y="160" font-size="24" text-anchor="middle" fill="#173552">Same unit</text><path d="M200,152 L280,152" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="130" font-size="18" text-anchor="middle" fill="#008C82">State</text><rect x="285" y="25" width="150" height="44" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="360" y="55" font-size="24" text-anchor="middle" fill="#2166AC">13 °C</text><path d="M360,75 L360,115" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="125" width="150" height="54" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="360" y="160" font-size="24" text-anchor="middle" fill="#173552">Same unit</text><path d="M440,152 L520,152" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="130" font-size="18" text-anchor="middle" fill="#008C82">State</text><rect x="525" y="25" width="150" height="44" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="600" y="55" font-size="24" text-anchor="middle" fill="#2166AC">15 °C</text><path d="M600,75 L600,115" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="525" y="125" width="150" height="54" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="600" y="160" font-size="24" text-anchor="middle" fill="#173552">Same unit</text><path d="M685,152 L745,152" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="125" width="175" height="54" rx="6" fill="#F5F8FB" stroke="#C45D24" stroke-width="2"/><text x="842.5" y="160" font-size="24" text-anchor="middle" fill="#C45D24">Forecast</text><text x="480" y="230" font-size="22" text-anchor="middle" fill="#173552">Earlier → later: update the state at each reading</text></g></svg>