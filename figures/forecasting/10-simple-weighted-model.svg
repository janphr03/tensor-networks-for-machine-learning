<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img"><title>Three weighted readings form a linear forecast</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#617185"/></marker></defs><rect width="960" height="290" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="170" y="32" font-size="22" text-anchor="middle" fill="#2166AC">Past readings (°C)</text><text x="450" y="32" font-size="22" text-anchor="middle" fill="#173552">Illustrative weights</text><text x="800" y="32" font-size="22" text-anchor="middle" fill="#C45D24">Forecast (°C)</text><rect x="115" y="55" width="110" height="44" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="170" y="85" font-size="24" text-anchor="middle" fill="#2166AC">12</text><path d="M240,77 L350,77" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="55" width="170" height="44" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="450" y="85" font-size="24" text-anchor="middle" fill="#173552">× 0.2</text><path d="M550,77 L650,142" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="115" y="120" width="110" height="44" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="170" y="150" font-size="24" text-anchor="middle" fill="#2166AC">13</text><path d="M240,142 L350,142" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="120" width="170" height="44" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="450" y="150" font-size="24" text-anchor="middle" fill="#173552">× 0.3</text><path d="M550,142 L650,142" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="115" y="185" width="110" height="44" rx="6" fill="#F5F8FB" stroke="#2166AC" stroke-width="2"/><text x="170" y="215" font-size="24" text-anchor="middle" fill="#2166AC">15</text><path d="M240,207 L350,207" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="185" width="170" height="44" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="450" y="215" font-size="24" text-anchor="middle" fill="#173552">× 0.5</text><path d="M550,207 L650,142" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="115" width="95" height="54" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="707.5" y="150" font-size="24" text-anchor="middle" fill="#173552">Sum</text><path d="M765,142 L800,142" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="115" width="125" height="54" rx="6" fill="#F5F8FB" stroke="#C45D24" stroke-width="2"/><text x="872.5" y="150" font-size="24" text-anchor="middle" fill="#C45D24">13.8</text><text x="480" y="267" font-size="24" text-anchor="middle" fill="#173552">0.2 × 12 + 0.3 × 13 + 0.5 × 15 = 13.8</text></g></svg>