<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><title>Eight invented hourly temperature readings</title><rect width="960" height="330" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="26" fill="#173552" text-anchor="start">One observation per hour</text><text x="40" y="72" font-size="19" fill="#617185" text-anchor="start">Temperature (°C)</text><line x1="90" y1="250" x2="900" y2="250" stroke="#D7E0E9" stroke-width="2"/><text x="76" y="257" font-size="19" fill="#617185" text-anchor="end">10</text><line x1="90" y1="196" x2="900" y2="196" stroke="#D7E0E9" stroke-width="2"/><text x="76" y="203" font-size="19" fill="#617185" text-anchor="end">12</text><line x1="90" y1="142" x2="900" y2="142" stroke="#D7E0E9" stroke-width="2"/><text x="76" y="149" font-size="19" fill="#617185" text-anchor="end">14</text><line x1="90" y1="88" x2="900" y2="88" stroke="#D7E0E9" stroke-width="2"/><text x="76" y="95" font-size="19" fill="#617185" text-anchor="end">16</text><polyline points="100,196 212,169 324,115 436,88 548,115 660,142 772,169 884,196" fill="none" stroke="#2166AC" stroke-width="4" stroke-linejoin="round"/><circle cx="100" cy="196" r="6" fill="#2166AC"/><text x="100" y="182" font-size="21" fill="#173552" text-anchor="middle">12</text><text x="100" y="282" font-size="20" fill="#617185" text-anchor="middle">1</text><circle cx="212" cy="169" r="6" fill="#2166AC"/><text x="212" y="155" font-size="21" fill="#173552" text-anchor="middle">13</text><text x="212" y="282" font-size="20" fill="#617185" text-anchor="middle">2</text><circle cx="324" cy="115" r="6" fill="#2166AC"/><text x="324" y="101" font-size="21" fill="#173552" text-anchor="middle">15</text><text x="324" y="282" font-size="20" fill="#617185" text-anchor="middle">3</text><circle cx="436" cy="88" r="6" fill="#2166AC"/><text x="436" y="74" font-size="21" fill="#173552" text-anchor="middle">16</text><text x="436" y="282" font-size="20" fill="#617185" text-anchor="middle">4</text><circle cx="548" cy="115" r="6" fill="#2166AC"/><text x="548" y="101" font-size="21" fill="#173552" text-anchor="middle">15</text><text x="548" y="282" font-size="20" fill="#617185" text-anchor="middle">5</text><circle cx="660" cy="142" r="6" fill="#2166AC"/><text x="660" y="128" font-size="21" fill="#173552" text-anchor="middle">14</text><text x="660" y="282" font-size="20" fill="#617185" text-anchor="middle">6</text><circle cx="772" cy="169" r="6" fill="#2166AC"/><text x="772" y="155" font-size="21" fill="#173552" text-anchor="middle">13</text><text x="772" y="282" font-size="20" fill="#617185" text-anchor="middle">7</text><circle cx="884" cy="196" r="6" fill="#2166AC"/><text x="884" y="182" font-size="21" fill="#173552" text-anchor="middle">12</text><text x="884" y="282" font-size="20" fill="#617185" text-anchor="middle">8</text><text x="900" y="314" font-size="20" fill="#617185" text-anchor="end">Hour</text></g></svg>