<svg xmlns="http://www.w3.org/2000/svg" width="960" height="215" viewBox="0 0 960 215" role="img" aria-labelledby="title description"><title id="title">One training example from four historical measurements</title><desc id="description">Four temperatures were measured at successive hours. The first three are grouped as input; the fourth is the observed target, not a predicted or calculated value.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="215" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="170" y="30" font-size="22" fill="#617185" text-anchor="middle" font-weight="normal">Hour 1</text><rect x="120" y="55" width="100" height="58" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="170" y="93.1" font-size="26" fill="#173552" text-anchor="middle" font-weight="normal">12 °C</text><text x="340" y="30" font-size="22" fill="#617185" text-anchor="middle" font-weight="normal">Hour 2</text><rect x="290" y="55" width="100" height="58" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="340" y="93.1" font-size="26" fill="#173552" text-anchor="middle" font-weight="normal">13 °C</text><text x="510" y="30" font-size="22" fill="#617185" text-anchor="middle" font-weight="normal">Hour 3</text><rect x="460" y="55" width="100" height="58" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="510" y="93.1" font-size="26" fill="#173552" text-anchor="middle" font-weight="normal">15 °C</text><text x="800" y="30" font-size="22" fill="#617185" text-anchor="middle" font-weight="normal">Hour 4</text><rect x="750" y="55" width="100" height="58" rx="6" fill="#D7EFEC" stroke="#008C82" stroke-width="2"/><text x="800" y="93.1" font-size="26" fill="#173552" text-anchor="middle" font-weight="normal">16 °C</text><line x1="110" y1="140" x2="570" y2="140" stroke="#2166AC" stroke-width="2"/><line x1="110" y1="130" x2="110" y2="140" stroke="#2166AC" stroke-width="2"/><line x1="570" y1="130" x2="570" y2="140" stroke="#2166AC" stroke-width="2"/><text x="340" y="176" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="normal">Input given to the model</text><text x="800" y="155" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">Observed target</text><text x="800" y="185" font-size="21" fill="#008C82" text-anchor="middle" font-weight="normal">for comparison</text><line x1="645" y1="45" x2="645" y2="195" stroke="#E8EEF4" stroke-width="2"/></g></svg>