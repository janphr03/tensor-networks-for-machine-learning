<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title description"><title id="title">A recurrent network with memory</title><desc id="description">Five observations are read one after another by the same cell. A hidden state passes from step to step as a memory, and the last state produces the forecast of the next value.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="370" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="38" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">A recurrent network reads step by step and carries a memory</text><rect x="60" y="262" width="80" height="46" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="100" y="292" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="14">1</tspan></text><line x1="100" y1="262" x2="100" y2="196" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="132" width="104" height="60" rx="12" fill="#FFFFFF" stroke="#173552" stroke-width="2.5"/><text x="100" y="168" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">cell</text><line x1="152" y1="162" x2="194" y2="162" stroke="#008C82" stroke-width="3" marker-end="url(#arrowTeal)"/><text x="175" y="148" font-size="17" fill="#008C82" text-anchor="middle" font-weight="normal">h<tspan dy="5" font-size="12">1</tspan></text><rect x="210" y="262" width="80" height="46" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="250" y="292" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="14">2</tspan></text><line x1="250" y1="262" x2="250" y2="196" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="198" y="132" width="104" height="60" rx="12" fill="#FFFFFF" stroke="#173552" stroke-width="2.5"/><text x="250" y="168" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">cell</text><line x1="302" y1="162" x2="344" y2="162" stroke="#008C82" stroke-width="3" marker-end="url(#arrowTeal)"/><text x="325" y="148" font-size="17" fill="#008C82" text-anchor="middle" font-weight="normal">h<tspan dy="5" font-size="12">2</tspan></text><rect x="360" y="262" width="80" height="46" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="400" y="292" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="14">3</tspan></text><line x1="400" y1="262" x2="400" y2="196" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="348" y="132" width="104" height="60" rx="12" fill="#FFFFFF" stroke="#173552" stroke-width="2.5"/><text x="400" y="168" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">cell</text><line x1="452" y1="162" x2="494" y2="162" stroke="#008C82" stroke-width="3" marker-end="url(#arrowTeal)"/><text x="475" y="148" font-size="17" fill="#008C82" text-anchor="middle" font-weight="normal">h<tspan dy="5" font-size="12">3</tspan></text><rect x="510" y="262" width="80" height="46" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="550" y="292" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="14">4</tspan></text><line x1="550" y1="262" x2="550" y2="196" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="498" y="132" width="104" height="60" rx="12" fill="#FFFFFF" stroke="#173552" stroke-width="2.5"/><text x="550" y="168" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">cell</text><line x1="602" y1="162" x2="644" y2="162" stroke="#008C82" stroke-width="3" marker-end="url(#arrowTeal)"/><text x="625" y="148" font-size="17" fill="#008C82" text-anchor="middle" font-weight="normal">h<tspan dy="5" font-size="12">4</tspan></text><rect x="660" y="262" width="80" height="46" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="700" y="292" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">x<tspan dy="6" font-size="14">5</tspan></text><line x1="700" y1="262" x2="700" y2="196" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="648" y="132" width="104" height="60" rx="12" fill="#FFFFFF" stroke="#173552" stroke-width="2.5"/><text x="700" y="168" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">cell</text><line x1="752" y1="162" x2="808" y2="162" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="814" y="138" width="110" height="48" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="869" y="169" font-size="20" fill="#D46B32" text-anchor="middle" font-weight="normal">ŷ<tspan dy="6" font-size="14">6</tspan></text><text x="400" y="96" font-size="17" fill="#008C82" text-anchor="middle" font-weight="normal">the hidden state h carries what has been read so far</text><text x="400" y="344" font-size="17" fill="#617185" text-anchor="middle" font-weight="normal">one observation per step, read in time order</text></g></svg>