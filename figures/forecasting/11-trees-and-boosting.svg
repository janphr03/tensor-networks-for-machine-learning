<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description"><title id="title">Decision trees and gradient boosting</title><desc id="description">A decision tree asks yes-or-no questions about temperature, hour, and wind and ends in leaves with predicted changes. Gradient boosting adds many small trees, each fitted to the remaining errors.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="410" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="38" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">Trees ask questions; boosting adds up many small trees</text><rect x="140" y="76" width="300" height="50" rx="10" fill="#FFFFFF" stroke="#173552" stroke-width="2"/><text x="290" y="107" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">temperature now &gt; 10 °C?</text><rect x="50" y="196" width="200" height="50" rx="10" fill="#FFFFFF" stroke="#173552" stroke-width="2"/><text x="150" y="227" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">hour &lt; 14?</text><rect x="320" y="196" width="220" height="50" rx="10" fill="#FFFFFF" stroke="#173552" stroke-width="2"/><text x="430" y="227" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">wind &gt; 5 m/s?</text><line x1="240" y1="126" x2="170" y2="194" stroke="#617185" stroke-width="2"/><line x1="340" y1="126" x2="410" y2="194" stroke="#617185" stroke-width="2"/><text x="186" y="160" font-size="16" fill="#617185" text-anchor="end" font-weight="normal">yes</text><text x="394" y="160" font-size="16" fill="#617185" text-anchor="start" font-weight="normal">no</text><line x1="120" y1="246" x2="88" y2="312" stroke="#617185" stroke-width="2"/><line x1="180" y1="246" x2="212" y2="312" stroke="#617185" stroke-width="2"/><line x1="400" y1="246" x2="368" y2="312" stroke="#617185" stroke-width="2"/><line x1="460" y1="246" x2="492" y2="312" stroke="#617185" stroke-width="2"/><text x="92" y="284" font-size="16" fill="#617185" text-anchor="end" font-weight="normal">yes</text><text x="208" y="284" font-size="16" fill="#617185" text-anchor="start" font-weight="normal">no</text><text x="372" y="284" font-size="16" fill="#617185" text-anchor="end" font-weight="normal">yes</text><text x="488" y="284" font-size="16" fill="#617185" text-anchor="start" font-weight="normal">no</text><rect x="24" y="314" width="112" height="46" rx="10" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="80" y="343" font-size="18" fill="#D46B32" text-anchor="middle" font-weight="bold">+1.5 °C</text><rect x="164" y="314" width="112" height="46" rx="10" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="220" y="343" font-size="18" fill="#D46B32" text-anchor="middle" font-weight="bold">−0.5 °C</text><rect x="304" y="314" width="112" height="46" rx="10" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="360" y="343" font-size="18" fill="#D46B32" text-anchor="middle" font-weight="bold">−1.0 °C</text><rect x="444" y="314" width="112" height="46" rx="10" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="500" y="343" font-size="18" fill="#D46B32" text-anchor="middle" font-weight="bold">+0.3 °C</text><text x="290" y="392" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">leaf = predicted change over the next hour</text><text x="650" y="96" font-size="19" fill="#173552" text-anchor="start" font-weight="bold">gradient boosting</text><circle cx="660" cy="138" r="9" fill="#173552" stroke="#FFFFFF" stroke-width="1.5"/><line x1="660" y1="138" x2="638" y2="174" stroke="#173552" stroke-width="2"/><line x1="660" y1="138" x2="682" y2="174" stroke="#173552" stroke-width="2"/><circle cx="638" cy="178" r="8" fill="#D46B32" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="682" cy="178" r="8" fill="#D46B32" stroke="#FFFFFF" stroke-width="1.5"/><text x="660" y="214" font-size="16" fill="#617185" text-anchor="middle" font-weight="normal">tree 1</text><text x="705" y="172" font-size="26" fill="#617185" text-anchor="middle" font-weight="bold">+</text><circle cx="750" cy="138" r="9" fill="#173552" stroke="#FFFFFF" stroke-width="1.5"/><line x1="750" y1="138" x2="728" y2="174" stroke="#173552" stroke-width="2"/><line x1="750" y1="138" x2="772" y2="174" stroke="#173552" stroke-width="2"/><circle cx="728" cy="178" r="8" fill="#D46B32" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="772" cy="178" r="8" fill="#D46B32" stroke="#FFFFFF" stroke-width="1.5"/><text x="750" y="214" font-size="16" fill="#617185" text-anchor="middle" font-weight="normal">tree 2</text><text x="795" y="172" font-size="26" fill="#617185" text-anchor="middle" font-weight="bold">+</text><circle cx="840" cy="138" r="9" fill="#173552" stroke="#FFFFFF" stroke-width="1.5"/><line x1="840" y1="138" x2="818" y2="174" stroke="#173552" stroke-width="2"/><line x1="840" y1="138" x2="862" y2="174" stroke="#173552" stroke-width="2"/><circle cx="818" cy="178" r="8" fill="#D46B32" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="862" cy="178" r="8" fill="#D46B32" stroke="#FFFFFF" stroke-width="1.5"/><text x="840" y="214" font-size="16" fill="#617185" text-anchor="middle" font-weight="normal">tree 3</text><text x="900" y="172" font-size="22" fill="#617185" text-anchor="start" font-weight="normal">+ …</text><text x="650" y="270" font-size="17" fill="#173552" text-anchor="start" font-weight="normal">Each new tree fits the errors</text><text x="650" y="292" font-size="17" fill="#173552" text-anchor="start" font-weight="normal">that the previous trees leave.</text><text x="650" y="326" font-size="17" fill="#173552" text-anchor="start" font-weight="normal">The forecast adds up all trees.</text></g></svg>