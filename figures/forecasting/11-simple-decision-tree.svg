<svg xmlns="http://www.w3.org/2000/svg" width="960" height="275" viewBox="0 0 960 275" role="img"><title>An illustrative learned split gives different predictions</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#617185"/></marker></defs><rect width="960" height="275" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="30" font-size="23" text-anchor="middle" fill="#2166AC">Input: 12, 13, 15 °C</text><rect x="265" y="55" width="430" height="56" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="480" y="91" font-size="24" text-anchor="middle" fill="#173552">Latest reading &gt; 14 °C?</text><path d="M370,115 L225,185" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><path d="M590,115 L735,185" fill="none" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><text x="190" y="153" font-size="21" text-anchor="middle" fill="#173552">No</text><text x="770" y="153" font-size="21" text-anchor="middle" fill="#008C82">Yes (15 &gt; 14)</text><rect x="90" y="195" width="270" height="54" rx="6" fill="#F5F8FB" stroke="#617185" stroke-width="2"/><text x="225" y="230" font-size="24" text-anchor="middle" fill="#617185">Predict 13 °C</text><rect x="600" y="195" width="270" height="54" rx="6" fill="#F5F8FB" stroke="#C45D24" stroke-width="2"/><text x="735" y="230" font-size="24" text-anchor="middle" fill="#C45D24">Predict 16 °C</text></g></svg>