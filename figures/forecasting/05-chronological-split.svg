<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title description"><title id="title">Chronological split and rolling origins</title><desc id="description">A series is divided in time into training, validation, and test parts. In the test part, forecasts start from several successive origins.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="340" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="38" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">Split in time: learn, choose, test</text><rect x="40" y="118" width="616" height="50" rx="0" fill="#DCE9F5" stroke="#FFFFFF" stroke-width="3"/><text x="348" y="150" font-size="19" fill="#173552" text-anchor="middle" font-weight="bold">training</text><text x="348" y="104" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">learn the parameters</text><rect x="656" y="118" width="132" height="50" rx="0" fill="#E8EEF4" stroke="#FFFFFF" stroke-width="3"/><text x="722" y="150" font-size="19" fill="#173552" text-anchor="middle" font-weight="bold">validation</text><text x="722" y="82" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">choose</text><text x="722" y="104" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">settings</text><rect x="788" y="118" width="132" height="50" rx="0" fill="#FBE2D4" stroke="#FFFFFF" stroke-width="3"/><text x="854" y="150" font-size="19" fill="#173552" text-anchor="middle" font-weight="bold">test</text><text x="854" y="82" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">final check</text><text x="854" y="104" font-size="17" fill="#173552" text-anchor="middle" font-weight="normal">(used once)</text><line x1="40" y1="190" x2="920" y2="190" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="214" font-size="17" fill="#617185" text-anchor="start" font-weight="normal">time</text><line x1="788" y1="168" x2="600" y2="230" stroke="#617185" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="920" y1="168" x2="920" y2="230" stroke="#617185" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="600" y1="248" x2="680" y2="248" stroke="#2166AC" stroke-width="5"/><line x1="680" y1="248" x2="740" y2="248" stroke="#D46B32" stroke-width="5"/><circle cx="680" cy="248" r="5" fill="#173552" stroke="#FFFFFF" stroke-width="1.5"/><line x1="600" y1="270" x2="725" y2="270" stroke="#2166AC" stroke-width="5"/><line x1="725" y1="270" x2="785" y2="270" stroke="#D46B32" stroke-width="5"/><circle cx="725" cy="270" r="5" fill="#173552" stroke="#FFFFFF" stroke-width="1.5"/><line x1="600" y1="292" x2="770" y2="292" stroke="#2166AC" stroke-width="5"/><line x1="770" y1="292" x2="830" y2="292" stroke="#D46B32" stroke-width="5"/><circle cx="770" cy="292" r="5" fill="#173552" stroke="#FFFFFF" stroke-width="1.5"/><line x1="600" y1="314" x2="815" y2="314" stroke="#2166AC" stroke-width="5"/><line x1="815" y1="314" x2="875" y2="314" stroke="#D46B32" stroke-width="5"/><circle cx="815" cy="314" r="5" fill="#173552" stroke="#FFFFFF" stroke-width="1.5"/><text x="585" y="256" font-size="17" fill="#173552" text-anchor="end" font-weight="bold">rolling origins in the test part:</text><text x="585" y="278" font-size="17" fill="#173552" text-anchor="end" font-weight="normal">known part (blue), horizon (orange),</text><text x="585" y="300" font-size="17" fill="#173552" text-anchor="end" font-weight="normal">then one step forward</text></g></svg>