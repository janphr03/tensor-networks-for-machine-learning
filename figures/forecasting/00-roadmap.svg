<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description"><title id="title">Structure of the theoretical background</title><desc id="description">Section 2.1 leads to two routes: established methods in Section 2.2, and the tensor route through Sections 2.3 to 2.6. Both routes meet in fair evaluation, Section 2.7, and the evidence review, Section 2.8.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="440" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="38" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">How the foundations build on each other</text><rect x="24" y="176" width="160" height="100" rx="10" fill="#F5F8FB" stroke="#617185" stroke-width="2.5"/><text x="40" y="206" font-size="19" fill="#617185" text-anchor="start" font-weight="bold">2.1</text><text x="40" y="233" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Time series</text><text x="40" y="256" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">and the task</text><rect x="228" y="74" width="540" height="96" rx="10" fill="#FFFFFF" stroke="#173552" stroke-width="2.5"/><text x="244" y="104" font-size="19" fill="#173552" text-anchor="start" font-weight="bold">2.2</text><text x="244" y="131" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Established methods: baselines, lag features,</text><text x="244" y="154" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">trees, neural networks, pretrained models</text><rect x="228" y="290" width="124" height="100" rx="10" fill="#FFFFFF" stroke="#008C82" stroke-width="2.5"/><text x="244" y="320" font-size="19" fill="#008C82" text-anchor="start" font-weight="bold">2.3</text><text x="244" y="347" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Why</text><text x="244" y="370" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">tensors?</text><rect x="368" y="290" width="124" height="100" rx="10" fill="#FFFFFF" stroke="#008C82" stroke-width="2.5"/><text x="384" y="320" font-size="19" fill="#008C82" text-anchor="start" font-weight="bold">2.4</text><text x="384" y="347" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Tensor</text><text x="384" y="370" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">mathematics</text><rect x="508" y="290" width="124" height="100" rx="10" fill="#FFFFFF" stroke="#008C82" stroke-width="2.5"/><text x="524" y="320" font-size="19" fill="#008C82" text-anchor="start" font-weight="bold">2.5</text><text x="524" y="347" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Tensor</text><text x="524" y="370" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">networks</text><rect x="648" y="290" width="124" height="100" rx="10" fill="#FFFFFF" stroke="#008C82" stroke-width="2.5"/><text x="664" y="320" font-size="19" fill="#008C82" text-anchor="start" font-weight="bold">2.6</text><text x="664" y="347" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Tensor</text><text x="664" y="370" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">models</text><rect x="808" y="126" width="128" height="100" rx="10" fill="#FFFFFF" stroke="#D46B32" stroke-width="2.5"/><text x="824" y="156" font-size="19" fill="#D46B32" text-anchor="start" font-weight="bold">2.7</text><text x="824" y="183" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Fair</text><text x="824" y="206" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">evaluation</text><rect x="808" y="290" width="128" height="100" rx="10" fill="#FFFFFF" stroke="#D46B32" stroke-width="2.5"/><text x="824" y="320" font-size="19" fill="#D46B32" text-anchor="start" font-weight="bold">2.8</text><text x="824" y="347" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">Evidence</text><text x="824" y="370" font-size="18" fill="#173552" text-anchor="start" font-weight="normal">and gap</text><path d="M184,206 C206,206 204,122 224,122" stroke="#617185" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M184,246 C206,246 204,340 224,340" stroke="#617185" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><line x1="352" y1="340" x2="364" y2="340" stroke="#008C82" stroke-width="2.5" marker-end="url(#arrowTeal)"/><line x1="492" y1="340" x2="504" y2="340" stroke="#008C82" stroke-width="2.5" marker-end="url(#arrowTeal)"/><line x1="632" y1="340" x2="644" y2="340" stroke="#008C82" stroke-width="2.5" marker-end="url(#arrowTeal)"/><path d="M768,122 C790,122 786,166 804,166" stroke="#173552" stroke-width="2.5" fill="none" marker-end="url(#arrowInk)"/><path d="M752,290 C770,250 782,206 804,198" stroke="#008C82" stroke-width="2.5" fill="none" marker-end="url(#arrowTeal)"/><line x1="872" y1="226" x2="872" y2="286" stroke="#D46B32" stroke-width="2.5" marker-end="url(#arrowOrange)"/><text x="228" y="62" font-size="17" fill="#173552" text-anchor="start" font-weight="bold">machine-learning route</text><text x="228" y="418" font-size="17" fill="#008C82" text-anchor="start" font-weight="bold">tensor route</text><text x="808" y="112" font-size="17" fill="#D46B32" text-anchor="start" font-weight="bold">both routes meet</text></g></svg>