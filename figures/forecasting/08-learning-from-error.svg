<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title description"><title id="title">Prediction error during training</title><desc id="description">An illustrative model predicts 14 degrees from inputs 12, 13, and 15. The observed target is 16, so the prediction is two degrees too low. Training uses such errors across examples to adjust parameters.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="240" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="165" y="30" font-size="22" fill="#2166AC" text-anchor="middle" font-weight="normal">Input (°C)</text><text x="470" y="30" font-size="22" fill="#173552" text-anchor="middle" font-weight="normal">Chosen model</text><text x="795" y="30" font-size="22" fill="#D46B32" text-anchor="middle" font-weight="normal">Prediction (°C)</text><rect x="45" y="52" width="240" height="58" rx="6" fill="#DCE9F5" stroke="#2166AC" stroke-width="2"/><text x="165" y="90.45" font-size="27" fill="#173552" text-anchor="middle" font-weight="normal">12, 13, 15</text><line x1="295" y1="81" x2="355" y2="81" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="52" width="210" height="58" rx="6" fill="#F5F8FB" stroke="#173552" stroke-width="2"/><text x="470" y="89.4" font-size="24" fill="#173552" text-anchor="middle" font-weight="normal">Parameters</text><line x1="585" y1="81" x2="650" y2="81" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="665" y="52" width="260" height="58" rx="6" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="795" y="90.45" font-size="27" fill="#173552" text-anchor="middle" font-weight="normal">14</text><text x="45" y="160" font-size="23" fill="#008C82" text-anchor="start" font-weight="normal">Observed target: 16 °C</text><text x="435" y="160" font-size="23" fill="#D46B32" text-anchor="start" font-weight="normal">Prediction: 2 °C too low</text><text x="480" y="215" font-size="23" fill="#173552" text-anchor="middle" font-weight="normal">Training uses errors to adjust the parameters.</text></g></svg>