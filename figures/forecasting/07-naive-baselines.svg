<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title description"><title id="title">Two simple reference forecasts</title><desc id="description">The same measured history is shown twice in blue. The orange forecast either repeats the last measurement, producing a horizontal line, or repeats the previous day. No actual future values are shown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker><marker id="arrowInk" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#173552"/></marker><marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#008C82"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D46B32"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2166AC"/></marker></defs><rect width="960" height="620" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="38" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">1. Keep the last value</text><rect x="620" y="95" width="260" height="135" rx="0" fill="#FBE2D4" stroke="none" stroke-width="0"/><line x1="100" y1="230" x2="880" y2="230" stroke="#E8EEF4" stroke-width="1"/><text x="90" y="236" font-size="16" fill="#617185" text-anchor="end" font-weight="normal">0</text><line x1="100" y1="162.5" x2="880" y2="162.5" stroke="#E8EEF4" stroke-width="1"/><text x="90" y="168.5" font-size="16" fill="#617185" text-anchor="end" font-weight="normal">7</text><line x1="100" y1="95" x2="880" y2="95" stroke="#E8EEF4" stroke-width="1"/><text x="90" y="101" font-size="16" fill="#617185" text-anchor="end" font-weight="normal">14</text><line x1="100" y1="230" x2="880" y2="230" stroke="#617185" stroke-width="1.5"/><line x1="100" y1="230" x2="100" y2="235" stroke="#617185" stroke-width="1.5"/><text x="100" y="254" font-size="16" fill="#617185" text-anchor="middle" font-weight="normal">24</text><line x1="360" y1="230" x2="360" y2="235" stroke="#617185" stroke-width="1.5"/><text x="360" y="254" font-size="16" fill="#617185" text-anchor="middle" font-weight="normal">48</text><line x1="620" y1="230" x2="620" y2="235" stroke="#617185" stroke-width="1.5"/><text x="620" y="254" font-size="16" fill="#617185" text-anchor="middle" font-weight="normal">72</text><line x1="880" y1="230" x2="880" y2="235" stroke="#617185" stroke-width="1.5"/><text x="880" y="254" font-size="16" fill="#617185" text-anchor="middle" font-weight="normal">96</text><text x="880" y="280" font-size="17" fill="#617185" text-anchor="end" font-weight="normal">Hour</text><text x="100" y="81" font-size="17" fill="#617185" text-anchor="start" font-weight="normal">Temperature (°C)</text><path d="M100.0,183.3 L110.8,192.1 L121.7,200.8 L132.5,206.1 L143.3,206.7 L154.2,206.6 L165.0,208.5 L175.8,198.0 L186.7,185.1 L197.5,173.2 L208.3,166.6 L219.2,151.9 L230.0,137.8 L240.8,132.6 L251.7,126.2 L262.5,122.6 L273.3,119.6 L284.2,122.9 L295.0,121.4 L305.8,125.3 L316.7,133.6 L327.5,141.0 L338.3,151.3 L349.2,163.0 L360.0,174.1 L370.8,191.1 L381.7,203.2 L392.5,205.0 L403.3,203.4 L414.2,201.4 L425.0,195.9 L435.8,192.0 L446.7,180.8 L457.5,173.6 L468.3,160.3 L479.2,149.2 L490.0,145.1 L500.8,134.6 L511.7,125.9 L522.5,123.6 L533.3,117.7 L544.2,116.3 L555.0,124.9 L565.8,132.7 L576.7,132.3 L587.5,152.9 L598.3,161.2 L609.2,166.4 L620.0,180.4" stroke="#2166AC" stroke-width="3" fill="none"/><path d="M620.0,180.4 L630.8,180.4 L641.7,180.4 L652.5,180.4 L663.3,180.4 L674.2,180.4 L685.0,180.4 L695.8,180.4 L706.7,180.4 L717.5,180.4 L728.3,180.4 L739.2,180.4 L750.0,180.4 L760.8,180.4 L771.7,180.4 L782.5,180.4 L793.3,180.4 L804.2,180.4 L815.0,180.4 L825.8,180.