<svg xmlns="http://www.w3.org/2000/svg" width="920" height="245" viewBox="0 0 920 245" role="img" aria-labelledby="title description"><title id="title">One base row or two: matrix ranks one and two</title><desc id="description">Two three-by-four matrices are compared. Left: all rows follow one blue base row, so the rank is one. Right: changing the second row last entry from 16 to 17 requires a second base row. Its unchanged values 4,8,12 are muted red; the changed 17 is strongly highlighted in red. The third row is still three times the first, so two base rows suffice and the rank is exactly two.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="920" height="245" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="220" y="28" font-size="25" fill="#173552" text-anchor="middle" font-weight="bold">Rank 1</text><rect x="90" y="52" width="60" height="40" fill="#DDEBF6" stroke="#2166AC" stroke-width="1.5"/><text x="120" y="79" font-size="21" fill="#2166AC" text-anchor="middle" font-weight="bold">2</text><rect x="155" y="52" width="60" height="40" fill="#DDEBF6" stroke="#2166AC" stroke-width="1.5"/><text x="185" y="79" font-size="21" fill="#2166AC" text-anchor="middle" font-weight="bold">4</text><rect x="220" y="52" width="60" height="40" fill="#DDEBF6" stroke="#2166AC" stroke-width="1.5"/><text x="250" y="79" font-size="21" fill="#2166AC" text-anchor="middle" font-weight="bold">6</text><rect x="285" y="52" width="60" height="40" fill="#DDEBF6" stroke="#2166AC" stroke-width="1.5"/><text x="315" y="79" font-size="21" fill="#2166AC" text-anchor="middle" font-weight="bold">8</text><rect x="90" y="97" width="60" height="40" fill="#F5F8FB" stroke="#617185" stroke-width="0.7"/><text x="120" y="124" font-size="21" fill="#617185" text-anchor="middle" font-weight="normal">4</text><rect x="155" y="97" wi