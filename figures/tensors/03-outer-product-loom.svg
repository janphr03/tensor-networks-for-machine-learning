<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title description"><title id="title">The outer product as a loom</title><desc id="description">Two blue row threads and three teal column threads form six crossings, containing three, four, five, six, eight, and ten. No summation occurs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="920" height="400" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="35" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">A woven table of all pairwise products</text><line x1="330" y1="95" x2="330" y2="305" stroke="#008C82" stroke-width="12"/><text x="330" y="80" font-size="21" fill="#008C82" text-anchor="middle" font-weight="normal">v1 = 3</text><line x1="505" y1="95" x2="505" y2="305" stroke="#008C82" stroke-width="12"/><text x="505" y="80" font-size="21" fill="#008C82" text-anchor="middle" font-weight="normal">v2 = 4</text><line x1="680" y1="95" x2="680" y2="305" stroke="#008C82" stroke-width="12"/><text x="680" y="80" font-size="21" fill="#008C82" text-anchor="middle" font-weight="normal">v3 = 5</text><line x1="215" y1="155" x2="805" y2="155" stroke="#2166AC" stroke-width="12"/><text x="170" y="161" font-size="21" fill="#2166AC" text-anchor="end" font-weight="normal">u1 = 1</text><circle cx="330" cy="155" r="32" fill="#FFFFFF" stroke="#D46B32" stroke-width="3"/><text x="330" y="163" font-size="26" fill="#D46B32" text-anchor="middle" font-weight="bold">3</text><circle cx="505" cy="155" r="32" fill="#FFFFFF" stroke="#D46B32" stroke-width="3"/><text x="505" y="163" font-size="26" fill="#D46B32" text-anchor="middle" font-weight="bold">4</text><circle cx="680" cy="155" r="32" fill="#FFFFFF" stroke="#D46B32" stroke-width="3"/><text x="680" y="163" font-size="26" fill="#D46B32" text-anchor="middle" font-weight="bold">5</text><line x1="215" y1="270" x2="805" y2="270" stroke="#2166AC" stroke-width="12"/><text x="170" y="276" font-size="21" fill="#2166AC" text-anchor="end" font-weight="normal">u2 = 2</text><circle cx="330" cy="270" r="32" fill="#FFFFFF" stroke="#D46B32" stroke-width="3"/><text x="330" y="278" font-size="26" fill="#D46B32" text-anchor="middle" font-weight="bold">6</text><circle cx="505" cy="270" r="32" fill="#FFFFFF" stroke="#D46B32" stroke-width="3"/><text x="505" y="278" font-size="26" fill="#D46B32" text-anchor="middle" font-weight="bold">8</text><circle cx="680" cy="270" r="32" fill="#FFFFFF" stroke="#D46B32" stroke-width="3"/><text x="680" y="278" font-size="26" fill="#D46B32" text-anchor="middle" font-weight="bold">10</text><text x="460" y="360" font-size="22" fill="#173552" text-anchor="middle" font-weight="normal">Each crossing keeps its own address: Mᵢⱼ = uᵢ vⱼ</text></g></svg>