<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="title description"><title id="title">Latent choices across a tensor train</title><desc id="description">A relay metaphor shows two possible labels on each internal connection. The formal diagram has three cores, each physical index of size four, and two bonds of size two. A dense tensor stores sixty-four entries; these TT cores store thirty-two.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="960" height="545" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="35" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">Small local descriptions share latent choices</text><path d="M145,142 Q305,117 465,142 Q625,117 785,142" stroke="#2166AC" stroke-width="10" fill="none"/><text x="305" y="122" font-size="18" fill="#2166AC" text-anchor="middle" font-weight="normal">label 1</text><text x="625" y="122" font-size="18" fill="#2166AC" text-anchor="middle" font-weight="normal">label 1</text><path d="M145,194 Q305,169 465,194 Q625,169 785,194" stroke="#D46B32" stroke-width="10" fill="none"/><text x="305" y="174" font-size="18" fill="#D46B32" text-anchor="middle" font-weight="normal">label 2</text><text x="625" y="174" font-size="18" fill="#D46B32" text-anchor="middle" font-weight="normal">label 2</text><line x1="145" y1="98" x2="145" y2="237" stroke="#617185" stroke-width="6"/><circle cx="145" cy="165" r="43" fill="#FFFFFF" stroke="#173552" stroke-width="3"/><text x="145" y="174" font-size="30" fill="#173552" text-anchor="middle" font-weight="bold">A</text><text x="145" y="273" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">local index i</text><line x1="465" y1="98" x2="465" y2="237" stroke="#617185" stroke-width="6"/><circle cx="465" cy="165" r="43" fill="#FFFFFF" stroke="#173552" stroke-width="3"/><text x="465" y="174" font-size="30" fill="#173552" text-anchor="middle" font-weight="bold">B</text><text x="465" y="273" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">local index j</text><line x1="785" y1="98" x2="785" y2="237" stroke="#617185" stroke-width="6"/><circle cx="785" cy="165" r="43" fill="#FFFFFF" stroke="#173552" stroke-width="3"/><text x="785" y="174" font-size="30" fill="#173552" text-anchor="middle" font-weight="bold">C</text><text x="785" y="273" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">local index k</text><text x="465" y="317" font-size="20" fill="#617185" text-anchor="middle" font-weight="normal">Formal diagram: each internal line below is one bond of size 2.</text><line x1="145" y1="377" x2="465" y2="377" stroke="#617185" stroke-width="4"/><line x1="465" y1="377" x2="785" y2="377" stroke="#617185" stroke-width="4"/><line x1="145" y1="377" x2="145" y2="435" stroke="#617185" stroke-width="3"/><circle cx="145" cy="377" r="24" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="145" y="384" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">A</text><text x="145" y="463" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">i: 1…4</text><line x1="465" y1="377" x2="465" y2="435" stroke="#617185" stroke-width="3"/><circle cx="465" cy="377" r="24" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="465" y="384" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">B</text><text x="465" y="463" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">j: 1…4</text><line x1="785" y1="377" x2="785" y2="435" stroke="#617185" stroke-width="3"/><circle cx="785" cy="377" r="24" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="785" y="384" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">C</text><text x="785" y="463" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">k: 1…4</text><text x="305" y="357" font-size="21" fill="#2166AC" text-anchor="middle" font-weight="normal">α: 1, 2</text><text x="625" y="357" font-size="21" fill="#D46B32" text-anchor="middle" font-weight="normal">β: 1, 2</text><text x="465" y="510" font-size="22" fill="#173552" text-anchor="middle" font-weight="normal">dense: 4³ = 64 entries    ·    TT cores: 8 + 16 + 8 = 32 entries</text></g></svg>