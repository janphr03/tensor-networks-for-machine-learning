ont-size="17" fill="#617185" text-anchor="start" font-weight="normal">r3</text><circle cx="580" cy="210" r="22" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="580" y="217" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">W</text><text x="580" y="278" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">k</text><circle cx="480" cy="140" r="30" fill="#008C82" stroke="#FFFFFF" stroke-width="2"/><text x="480" y="147" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">G</text><text x="800" y="86" font-size="21" fill="#173552" text-anchor="middle" font-weight="bold">TT / MPS: beads on a string</text><line x1="700" y1="185" x2="900" y2="185" stroke="#617185" stroke-width="3"/><line x1="700" y1="185" x2="700" y2="258" stroke="#617185" stroke-width="2.5"/><circle cx="700" cy="185" r="23" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="700" y="192" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">A</text><text x="700" y="283" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">i</text><line x1="800" y1="185" x2="800" y2="258" stroke="#617185" stroke-width="2.5"/><circle cx="800" cy="185" r="23" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="800" y="192" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">B</text><text x="800" y="283" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">j</text><line x1="900" y1="185" x2="900" y2="258" stroke="#617185" stroke-width="2.5"/><circle cx="900" cy="185" r="23" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="900" y="192" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">C</text><text x="900" y="283" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">k</text><text x="750" y="163" font-size="18" fill="#617185" text-anchor="middle" font-weight="normal">r₁</text><text x="850" y="163" font-size="18" fill="#617185" text-anchor="middle" font-weight="normal">r₂</text><line x1="40" y1="347" x2="920" y2="347" stroke="#E8EEF4" stroke-width="1"/><text x="265" y="400" font-size="21" fill="#173552" text-anchor="middle" font-weight="bold">MPO: paired input and output legs</text><line x1="155" y1="493" x2="375" y2="493" stroke="#617185" stroke-width="3"/><line x1="155" y1="441" x2="155" y2="555" stroke="#617185" stroke-width="2.5"/><circle cx="155" cy="493" r="25" fill="#008C82" stroke="#FFFFFF" stroke-width="2"/><text x="155" y="500" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M₁</text><text x="155" y="430" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">j1</text><text x="155" y="584" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">i1</text><line x1="265" y1="441" x2="265" y2="555" stroke="#617185" stroke-width="2.5"/><circle cx="265" cy="493" r="25" fill="#008C82" stroke="#FFFFFF" stroke-width="2"/><text x="265" y="500" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M₂</text><text x="265" y="430" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">j2</text><text x="265" y="584" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">i2</text><line x1="375" y1="441" x2="375" y2="555" stroke="#617185" stroke-width="2.5"/><circle cx="375" cy="493" r="25" fill="#008C82" stroke="#FFFFFF" stroke-width="2"/><text x="375" y="500" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">M₃</text><text x="375" y="430" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">j3</text><text x="375" y="584" font-size="19" fill="#173552" text-anchor="middle" font-weight="normal">i3</text><text x="715" y="400" font-size="21" fill="#173552" text-anchor="middle" font-weight="bold">Tree: local groups meet higher up</text><line x1="715" y1="440" x2="645" y2="490" stroke="#617185" stroke-width="3"/><line x1="715" y1="440" x2="785" y2="490" stroke="#6