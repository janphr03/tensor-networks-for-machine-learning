<svg xmlns="http://www.w3.org/2000/svg" width="960" height="695" viewBox="0 0 960 695" role="img" aria-labelledby="title description"><title id="title">Network topologies as organisational metaphors</title><desc id="description">CP uses a copy tensor delta to select the same component across factors. Tucker has a general mixing core. TT is a chain. MPO has input-output index pairs. A binary tree groups local tensors hierarchically.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="960" height="695" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="35" font-size="25" fill="#173552" text-anchor="start" font-weight="bold">Different ways to organise the same kind of building blocks</text><text x="160" y="86" font-size="21" fill="#173552" text-anchor="middle" font-weight="bold">CP: a shared component</text><line x1="160" y1="140" x2="70" y2="207" stroke="#617185" stroke-width="2.5"/><line x1="70" y1="207" x2="70" y2="259" stroke="#617185" stroke-width="2.5"/><circle cx="70" cy="207" r="22" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="70" y="214" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">U</text><text x="70" y="285" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">i</text><line x1="160" y1="140" x2="160" y2="240" stroke="#617185" stroke-width="2.5"/><line x1="160" y1="240" x2="160" y2="292" stroke="#617185" stroke-width="2.5"/><circle cx="160" cy="240" r="22" fill="#2166AC" stroke="#FFFFFF" stroke-width="2"/><text x="160" y="247" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="bold">V</text><text x="160" y="318" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">j</text><line x1="160" y1="140" x2="250" y2="207" stroke="#617185" stroke-width="2.5"/><line x1="250" y1="207" x2="250" y2="