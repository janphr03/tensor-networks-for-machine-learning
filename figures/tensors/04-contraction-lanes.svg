<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="title description"><title id="title">Calculating directly with seven factors</title><desc id="description">Four inputs one, two, three, four are paired with the shared weights two, four, six, eight. Multiplying the pairs and adding produces the shared sum sixty. Multipliers one, two, three turn that sum into outputs sixty, one hundred twenty, one hundred eighty. No full weight matrix is built.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="920" height="250" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="80" y="30" font-size="23" fill="#173552" text-anchor="middle" font-weight="bold">Inputs x</text><text x="225" y="30" font-size="23" fill="#173552" text-anchor="middle" font-weight="bold">Weights v</text><text x="445" y="30" font-size="23" fill="#173552" text-anchor="middle" font-weight="bold">Sum</text><text x="665" y="30" font-size="23" fill="#173552" text-anchor="middle" font-weight="bold">Factors u</text><text x="820" y="30" font-size="23" fill="#173552" text-anchor="middle" font-weight="bold">Outputs y</text><rect x="50" y="66" width="60" height="36" fill="#F5F8FB" stroke="#2166AC" stroke-width="1.5"/><text x="80" y="92" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="normal">1</text><text x="155" y="92" font-size="26" fill="#617185" text-anchor="middle" font-weight="normal">×</text><rect x="195" y="66" width="60" height="36" fill="#E5F4F1" stroke="#008C82" stroke-width="1.5"/><text x="225" y="92" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">2</text><path d="M270,84 C330,84 350,150 410,150" stroke="#617185" stroke-width="2" fill="none"/><rect x="50" y="110" width="60" height="36" fill="#F5F8FB" stroke="#2166AC" stroke-width="1.5"/><text x="80" y="136" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="normal">2</text><text x="155" y="136" font-size="26" fill="#617185" text-anchor="middle" font-weight="normal">×</text><rect x="195" y="110" width="60" height="36" fill="#E5F4F1" stroke="#008C82" stroke-width="1.5"/><text x="225" y="136" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">4</text><path d="M270,128 C330,128 350,150 410,150" stroke="#617185" stroke-width="2" fill="none"/><rect x="50" y="154" width="60" height="36" fill="#F5F8FB" stroke="#2166AC" stroke-width="1.5"/><text x="80" y="180" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="normal">3</text><text x="155" y="180" font-size="26" fill="#617185" text-anchor="middle" font-weight="normal">×</text><rect x="195" y="154" width="60" height="36" fill="#E5F4F1" stroke="#008C82" stroke-width="1.5"/><text x="225" y="180" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">6</text><path d="M270,172 C330,172 350,150 410,150" stroke="#617185" stroke-width="2" fill="none"/><rect x="50" y="198" width="60" height="36" fill="#F5F8FB" stroke="#2166AC" stroke-width="1.5"/><text x="80" y="224" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="normal">4</text><text x="155" y="224" font-size="26" fill="#617185" text-anchor="middle" font-weight="normal">×</text><rect x="195" y="198" width="60" height="36" fill="#E5F4F1" stroke="#008C82" stroke-width="1.5"/><text x="225" y="224" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">8</text><path d="M270,216 C330,216 350,150 410,150" stroke="#617185" stroke-width="2" fill="none"/><circle cx="445" cy="150" r="34" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="445" y="160" font-size="29" fill="#D46B32" text-anchor="middle" font-weight="bold">60</text><text x="375" y="140" font-size="25" fill="#617185" text-anchor="middle" font-weight="normal">Σ</text><path d="M480,150 C535,150 535,90 590,90" stroke="#617185" stroke-width="2" fill="none"/><text x="615" y="98" font-size="26" fill="#617185" text-anchor="middle" font-weight="normal">×</text><rect x="640" y="71" width="50" height="38" fill="#E5F4F1" stroke="#008C82" stroke-width="1.5"/><text x="665" y="98" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">1</text><line x1="705" y1="90" x2="770" y2="90" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="785" y="71" width="70" height="38" fill="#F5F8FB" stroke="#2166AC" stroke-width="1.5"/><text x="820" y="98" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="bold">60</text><path d="M480,150 C535,150 535,150 590,150" stroke="#617185" stroke-width="2" fill="none"/><text x="615" y="158" font-size="26" fill="#617185" text-anchor="middle" font-weight="normal">×</text><rect x="640" y="131" width="50" height="38" fill="#E5F4F1" stroke="#008C82" stroke-width="1.5"/><text x="665" y="158" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">2</text><line x1="705" y1="150" x2="770" y2="150" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="785" y="131" width="70" height="38" fill="#F5F8FB" stroke="#2166AC" stroke-width="1.5"/><text x="820" y="158" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="bold">120</text><path d="M480,150 C535,150 535,210 590,210" stroke="#617185" stroke-width="2" fill="none"/><text x="615" y="218" font-size="26" fill="#617185" text-anchor="middle" font-weight="normal">×</text><rect x="640" y="191" width="50" height="38" fill="#E5F4F1" stroke="#008C82" stroke-width="1.5"/><text x="665" y="218" font-size="23" fill="#008C82" text-anchor="middle" font-weight="normal">3</text><line x1="705" y1="210" x2="770" y2="210" stroke="#617185" stroke-width="2" marker-end="url(#arrow)"/><rect x="785" y="191" width="70" height="38" fill="#F5F8FB" stroke="#2166AC" stroke-width="1.5"/><text x="820" y="218" font-size="23" fill="#2166AC" text-anchor="m