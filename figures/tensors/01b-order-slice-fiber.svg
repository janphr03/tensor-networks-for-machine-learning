<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-labelledby="title description"><title id="title">From tensor to slice to fiber</title><desc id="description">The original tensor has order three and shape two by three by two. Fixing location two selects a three-by-two matrix slice containing rows seven-eight, nine-ten, and eleven-twelve. Fixing temperature as well selects the day fiber seven, nine, eleven, which has order one. The remaining free indices are listed below each view.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="920" height="350" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="150" y="30" font-size="25" fill="#173552" text-anchor="middle" font-weight="bold">Tensor</text><text x="150" y="62" font-size="21" fill="#617185" text-anchor="middle" font-weight="normal">Order 3</text><text x="475" y="30" font-size="25" fill="#173552" text-anchor="middle" font-weight="bold">Slice</text><text x="475" y="62" font-size="21" fill="#617185" text-anchor="middle" font-weight="normal">Order 2</text><text x="800" y="30" font-size="25" fill="#173552" text-anchor="middle" font-weight="bold">Fiber</text><text x="800" y="62" font-size="21" fill="#617185" text-anchor="middle" font-weight="normal">Order 1</text><path d="M50,110 L95,80 L255,80 L210,110 Z" stroke="#617185" stroke-width="1.5" fill="#E5F4F1"/><path d="M210,110 L255,80 L255,224 L210,254 Z" stroke="#617185" stroke-width="1.5" fill="#D5E9E6"/><line x1="130" y1="110" x2="175" y2="80" stroke="#617185" stroke-width="1"/><line x1="72.5" y1="95" x2="232.5" y2="95" stroke="#617185" stroke-width="1"/><line x1="232.5" y1="95" x2="232.5" y2="239" stroke="#617185" stroke-width="1"/><line x1="210" y1="158" x2="255" y2="128" stroke="#617185" stroke-width="1"/><line x1="210" y1="206" x2="255