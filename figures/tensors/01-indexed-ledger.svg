<svg xmlns="http://www.w3.org/2000/svg" width="920" height="625" viewBox="0 0 920 625" role="img" aria-labelledby="title description"><title id="title">A tensor as a stack of location tables</title><desc id="description">A three-dimensional two-by-three-by-two block has location as depth, day as height, and variable as width. Its front layer, location two, displays readings seven to twelve. The orange cell is temperature on day three at location two, eleven degrees Celsius. Separate arrows identify all three index directions. Values are invented.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="920" height="625" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="35" y="35" font-size="25" fill="#173552" text-anchor="start" font-weight="bold">One table per location: stack the tables to form a tensor</text><path d="M200,170 L320,90 L640,90 L520,170 Z" stroke="#617185" stroke-width="2" fill="#E5F4F1"/><path d="M520,170 L640,90 L640,330 L520,410 Z" stroke="#617185" stroke-width="2" fill="#D5E9E6"/><line x1="360" y1="170" x2="480" y2="90" stroke="#617185" stroke-width="1.5"/><line x1="260" y1="130" x2="580" y2="130" stroke="#617185" stroke-width="1.5"/><line x1="580" y1="130" x2="580" y2="370" stroke="#617185" stroke-width="1.5"/><line x1="520" y1="250" x2="640" y2="170" stroke="#617185" stroke-width="1.5"/><line x1="520" y1="330" x2="640" y2="250" stroke="#617185" stroke-width="1.5"/><rect x="200" y="170" width="320" height="240" fill="#F5F8FB" stroke="#008C82" stroke-width="3"/><rect x="201" y="331" width="158" height="78" fill="#FBE2D4" stroke="none" stroke-width="1"/><line x1="360" y1="170" x2="360" y2="410" stroke="#617185" stroke-width="1.5"/><line x1="200" y1="250" x2="520" y2="250" stroke="#617185" stroke-width="1.5"/><line x1="200" y1="330" x2="520" y2="330" stroke="#617185" stroke-width="1.5"/><text x="280" y="220" font-size="25" fill="#173552" text-anchor="middle" font-weight="normal">7</text><text x="440" y="220" font-size="25" fill="#173552" text-anchor="middle" font-weight="normal">8</text><text x="280" y="300" font-size="25" fill="#173552" text-anchor="middle" font-weight="normal">9</text><text x="440" y="300" font-size="25" fill="#173552" text-anchor="middle" font-weight="normal">10</text><text x="280" y="380" font-size="31" fill="#D46B32" text-anchor="middle" font-weight="bold">11</text><text x="440" y="380" font-size="25" fill="#173552" text-anchor="middle" font-weight="normal">12</text><line x1="145" y1="170" x2="145" y2="425" stroke="#2166AC" stroke-width="2.5" marker-end="url(#arrow)"/><text x="130" y="145" font-size="21" fill="#2166AC" text-anchor="end" font-weight="bold">Day (t)</text><line x1="138" y1="210" x2="152" y2="210" stroke="#2166AC" stroke-width="2"/><text x="125" y="217" font-size="20" fill="#2166AC" text-anchor="end" font-weight="normal">Day 1</text><line x1="138" y1="290" x2="152" y2="290" stroke="#2166AC" stroke-width="2"/><text x="125" y="297" font-size="20" fill="#2166AC" text-anchor="end" font-weight="normal">Day 2</text><line x1="138" y1="370" x2="152" y2="370" stroke="#2166AC" stroke-width="2"/><text x="125" y="377" font-size="20" fill="#2166AC" text-anchor="end" font-weight="normal">Day 3</text><line x1="200" y1="455" x2="535" y2="455" stroke="#617185" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="280" y1="449" x2="280" y2="462" stroke="#617185" stroke-width="2"/><line x1="440" y1="449" x2="440" y2="462" stroke="#617185" stroke-width="2"/><text x="280" y="490" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">Temperature</text><text x="280" y="516" font-size="18" fill="#617185" text-anchor="middle" font-weight="normal">v = 1</text><text x="440" y="490" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">Humidity</text><text x="440" y="516" font-size="18" fill="#617185" text-anchor="middle" font-weight="normal">v = 2</text><text x="360" y="551" font-size="21" fill="#173552" text-anchor="middle" font-weight="bold">Variable (v)</text><line x1="790" y1="97" x2="650" y2="190" stroke="#008C82" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="763" y1="99" x2="777" y2="121" stroke="#008C82" stroke-width="2"/><line x1="643" y1="179" x2="657" y2="201" stroke="#008C82" stroke-width="2"/><text x="745" y="70" font-size="21" fill="#008C82" text-anchor="start" font-weight="bold">Location (s)</text><text x="790" y="140" font-size="20" fill="#008C82" text-anchor="start" font-weight="normal">1: back layer</text><text x="670" y="220" font-size="20" fill="#008C82" text-anchor="start" font-weight="normal">2: front layer</text><text x="720" y="350" font-size="20" fill="#617185" text-anchor="middle" font-weight="normal">Highlighted cell:</text><text x="720" y="385" font-size="30" fill="#D46B32" text-anchor="middle" font-weight="bold">11 °C</text><text x="720" y="421" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">Location 2</text><text x="720" y="449" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">Day 3</text><text x="720" y="477" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">Temperature</text><text x="460" y="601" font-size="22" fill="#173552" text-anchor="middle" font-weight="normal">X₂,₃,₁ = 11     ·     2 locations × 3 days × 2 variables</text></g></svg>