" font-weight="normal">t = 2</text><line x1="557" y1="231" x2="690" y2="231" stroke="#E8EEF4" stroke-width="1"/><text x="585" y="217" font-size="23" fill="#173552" text-anchor="middle" font-weight="normal">9</text><text x="657" y="217" font-size="23" fill="#173552" text-anchor="middle" font-weight="normal">10</text><text x="510" y="259" font-size="18" fill="#617185" text-anchor="start" font-weight="normal">t = 3</text><line x1="557" y1="273" x2="690" y2="273" stroke="#E8EEF4" stroke-width="1"/><circle cx="585" cy="253" r="18" fill="#FBE2D4" stroke="#D46B32" stroke-width="2"/><text x="585" y="259" font-size="23" fill="#D46B32" text-anchor="middle" font-weight="normal">11</text><text x="657" y="259" font-size="23" fill="#173552" text-anchor="middle" font-weight="normal">12</text><text x="460" y="345" font-size="21" fill="#173552" text-anchor="middle" font-weight="normal">X₂,₃,₁ = 11     ·     shape: 2 series × 3 times × 2 variables</text></g></svg>