<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-labelledby="title description"><title id="title">Unfolding the ledger</title><desc id="description">A three-way tensor is unfolded into a two-by-six matrix with explicitly ordered column pairs. The value eleven moves to row two, column five.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="920" height="370" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="30" y="35" font-size="26" fill="#173552" text-anchor="start" font-weight="bold">Change the address; keep every value</text><text x="140" y="85" font-size="20" fill="#617185" text-anchor="middle" font-weight="normal">two pages</text><rect x="105" y="110" width="42" height="42" fill="#F5F8FB" stroke="#FFFFFF" stroke-width="2"/><text x="126" y="137.72" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">7</text><rect x="147" y="110" width="42" height="42" fill="#F5F8FB" stroke="#FFFFFF" stroke-width="2"/><text x="168" y="137.72" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">8</text><rect x="105" y="152" width="42" height="42" fill="#F5F8FB" stroke="#FFFFFF" stroke-width="2"/><text x="126" y="179.72" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">9</text><rect x="147" y="152" width="42" height="42" fill="#F5F8FB" stroke="#FFFFFF" stroke-width="2"/><text x="168" y="179.72" font-size="20" fill="#173552" text-anchor="middle" font-weight="normal">10</text><rect x="105" y="194" width="42" height="42" fill="#FBE2D4" stroke="#FFFFFF" stroke-width="2"/><text x="126" y="221.72" font-size="20" fill="#D46B32" text-anchor="middle" font-weight="normal">11</text><rect x="147" y="194" width="42" height="42" fill="#F5F8FB" stroke="#FFFFFF" stroke-width="2"/><text x="168" y="221.72"