<svg xmlns="http://www.w3.org/2000/svg" width="920" height="170" viewBox="0 0 920 170" role="img" aria-labelledby="title description"><title id="title">Each location table becomes one matrix row</title><desc id="description">Two small three-by-two location tables stand side by side on the left. One arrow leads to a two-by-six matrix on the right. Blue location one becomes the first row, containing one through six. Teal location two becomes the second row, containing seven through twelve. Eleven stays highlighted orange in both views. All twelve values are preserved.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#617185"/></marker></defs><rect width="920" height="170" fill="white"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="656" y="30" font-size="24" fill="#173552" text-anchor="middle" font-weight="bold">One matrix</text><text x="90" y="30" font-size="22" fill="#2166AC" text-anchor="middle" font-weight="bold">Location 1</text><rect x="45" y="54" width="45" height="32" fill="#E8F0F8" stroke="#FFFFFF" stroke-width="2"/><text x="67.5" y="77" font-size="21" fill="#2166AC" text-anchor="middle" font-weight="normal">1</text><rect x="440" y="62" width="72" height="44" fill="#E8F0F8" stroke="#FFFFFF" stroke-width="2"/><text x="476" y="92" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="normal">1</text><rect x="90" y="54" width="45" height="32" fill="#E8F0F8" stroke="#FFFFFF" stroke-width="2"/><text x="112.5" y="77" font-size="21" fill="#2166AC" text-anchor="middle" font-weight="normal">2</text><rect x="512" y="62" width="72" height="44" fill="#E8F0F8" stroke="#FFFFFF" stroke-width="2"/><text x="548" y="92" font-size="23" fill="#2166AC" text-anchor="middle" font-weight="normal">2</text><rect x="45" y="86" width="45" height="32" fill="#E8F0F8" stroke="#FFFFFF" stroke-width="2"/><text x="67.5" y="109" font-size="21" fill="#