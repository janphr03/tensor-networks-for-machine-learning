font-weight="normal">12</text><text x="580" y="85" font-size="20" fill="#617185" text-anchor="middle" font-weight="normal">one row per series</text><text x="426" y="258" font-size="17" fill="#617185" text-anchor="middle" font-weight="normal">(1,1)</text><text x="488" y="258" font-size="17" fill="#617185" text-anchor="middle" font-weight="normal">(1,2)</text><text x="550" y="258" font-size="17" fill="#617185" text-anchor="middle" font-weight="normal">(2,1)</text><text x="612" y="258" font-size="17" fill="#617185" text-anchor="middle" font-weight="normal">(2,2)</text><text x="674" y="258" font-size="17" fill="#617185" text-anchor="middle" font-weight="normal">(3,1)</text><text x="736" y="258" font-size="17" fill="#617185" text-anchor="middle" font-weight="normal">(3,2)</text><text x="580" y="290" font-size="20" fill="#617185" text-anchor="middle" font-weight="normal">column address: (time, variable)</text><text x="460" y="337" font-size="21" fill="#173552" text-anchor="middle" font-weight="normal">2 × 3 × 2 entries  →  2 × 6 entries     ·     twelve values in both views</text></g></svg>